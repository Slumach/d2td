<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>D2 Tower Defense</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111;
      }
      body {
        display: flex;
      }
      /* start.ts sets the margins: the letterbox, on device pixel boundaries (auto until it does) */
      #game {
        margin: auto;
      }
      /* Block, so no text-baseline gap below the canvas makes the page taller than the window;
         nearest neighbour for the whole-number upscale to the screen */
      #game canvas {
        display: block;
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
